[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-primer-design"
version = "1.0.3"
description = "A high-throughput rational design pipeline for TaqMan assays in variable genomes."
readme = "README.md"
authors = [
  { name = "Thanh Nguyen", email = "nguyenthanh727@gmail.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.79",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "psutil",
    "python-Levenshtein>=0.12.2",
    "openai>=1.14.0",
    "streamlit>=1.20.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.7", "seaborn>=0.12"]
web = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "python-multipart>=0.0.9"]

[project.urls]
"Homepage" = "https://github.com/thanh727/rational-primer-design"
"Bug Tracker" = "https://github.com/thanh727/rational-primer-design/issues"

[project.scripts]
rational-design = "rational_design.cli:main"
rational-design-api = "rational_design.api_server:main"

[tool.setuptools.packages.find]
include = ["rational_design*"]
